services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://wonderkidz:wonderkidz@db:5432/wonderkidz
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wonderkidz
      POSTGRES_USER: wonderkidz
      POSTGRES_PASSWORD: wonderkidz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonderkidz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
